[package]
name = "chatgpt-desktop-switcher"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication"] }

[build-dependencies]
tauri-build = "2.0.0"

[dev-dependencies]
tempfile = "3"
